; NOTE (J40): for the cpanel-vps and docker profiles only. NOT usable on shared hosting
; (no root, no long-running processes); there cron drains the queue (deploy/HOSTING.md section 2).
; P10 — dedicated queue worker (RECOMMENDED production setup).
;
; Drains the `heavy` and `default` queues so order-confirmation mail, SMS/WhatsApp
; and backup jobs fire within seconds instead of waiting up to ~60s for the
; scheduler-cron fallback (app/Console/Kernel.php). While this daemon runs it
; keeps BOTH heartbeats fresh (queue_worker_alive for web requests, and
; queue_worker_daemon_alive — the key the scheduler drains gate on via
; ->when(fn () => !queue_daemon_alive())) so the fallback drains auto-disable:
; no double-consumer race. NB: keep --stop-when-empty OUT of this command —
; its presence is what marks a process as a scheduler fallback drain rather
; than a daemon (queue_worker_stamp_heartbeat in app/Http/Helpers/Helper.php).
;
; Install: copy to /etc/supervisor/conf.d/juwri-worker.conf, then
;   supervisorctl reread && supervisorctl update && supervisorctl start juwri-worker:* juwri-worker-heavy:*
; Adjust `command` php path, `directory`, `user`, and numprocs for your host.
; After a deploy: `supervisorctl restart juwri-worker:*` so workers load new code.

[program:juwri-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/juwri/core/artisan queue:work --queue=default --sleep=1 --tries=3 --max-time=3600
directory=/var/www/juwri/core
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/juwri/core/storage/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=300

; P6-64b — long jobs (up to 1800s) run on the `heavy` queue via the `heavy` connection
; whose retry_after is 1860s; the default connection keeps a short retry_after (150s)
; so a crashed worker's order/webhook jobs are redelivered quickly.
[program:juwri-worker-heavy]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/juwri/core/artisan queue:work heavy --queue=heavy --sleep=1 --tries=3 --max-time=3600
directory=/var/www/juwri/core
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/juwri/core/storage/logs/worker-heavy.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=1900
