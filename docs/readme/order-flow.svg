<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="juwri-flow-title juwri-flow-desc">
  <title id="juwri-flow-title">One commerce engine, any vertical</title>
  <desc id="juwri-flow-desc">An animated five-stage timeline: catalogue, cart or booking, fulfilment, payment, then reports. A progress line and a moving marker travel from left to right across every store type.</desc>
  <defs>
    <linearGradient id="jf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1410"/>
      <stop offset="1" stop-color="#132B20"/>
    </linearGradient>
    <linearGradient id="jf-rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E9F6E"/>
      <stop offset="1" stop-color="#5AD6AE"/>
    </linearGradient>
    <clipPath id="jf-card">
      <rect x="0" y="0" width="1200" height="280" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#jf-card)">
    <rect width="1200" height="280" fill="url(#jf-bg)"/>
    <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="48" y="50" font-size="11.5" font-weight="700" letter-spacing="3" fill="#5AD6AE">ONE ENGINE · ANY VERTICAL</text>
      <text x="1152" y="50" text-anchor="end" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#7E9C8C">SELF-HOSTED</text>
      <circle cx="1102" cy="45" r="4" fill="#5AD6AE">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <rect x="120" y="138" width="980" height="4" rx="2" fill="#234034"/>
      <rect x="120" y="138" width="0" height="4" rx="2" fill="url(#jf-rail)">
        <animate attributeName="width" values="0;980;980;0" keyTimes="0;0.7;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
      <circle r="6" fill="#8FE8C9">
        <animateMotion path="M120 140 H1100" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.7;0.76" dur="10s" repeatCount="indefinite"/>
      </circle>

      <g>
        <circle cx="120" cy="140" r="19" fill="#14241C" stroke="#2A4738" stroke-width="2">
          <animate attributeName="fill" values="#14241C;#14241C;#0E9F6E;#14241C;#14241C" keyTimes="0;0.02;0.08;0.20;1" dur="10s" repeatCount="indefinite"/>
        </circle>
        <text x="120" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
        <text x="120" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#E8F3ED">Catalogue</text>
        <text x="120" y="217" text-anchor="middle" font-size="11" fill="#9DB3A9">items, variants, rooms</text>
      </g>
      <g>
        <circle cx="365" cy="140" r="19" fill="#14241C" stroke="#2A4738" stroke-width="2">
          <animate attributeName="fill" values="#14241C;#14241C;#0E9F6E;#14241C;#14241C" keyTimes="0;0.22;0.28;0.40;1" dur="10s" repeatCount="indefinite"/>
        </circle>
        <text x="365" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
        <text x="365" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#E8F3ED">Cart or booking</text>
        <text x="365" y="217" text-anchor="middle" font-size="11" fill="#9DB3A9">web, POS, agent</text>
      </g>
      <g>
        <circle cx="610" cy="140" r="19" fill="#14241C" stroke="#2A4738" stroke-width="2">
          <animate attributeName="fill" values="#14241C;#14241C;#0E9F6E;#14241C;#14241C" keyTimes="0;0.38;0.44;0.56;1" dur="10s" repeatCount="indefinite"/>
        </circle>
        <text x="610" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
        <text x="610" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#E8F3ED">Fulfilment</text>
        <text x="610" y="217" text-anchor="middle" font-size="11" fill="#9DB3A9">dine-in, ship, pickup</text>
      </g>
      <g>
        <circle cx="855" cy="140" r="19" fill="#14241C" stroke="#2A4738" stroke-width="2">
          <animate attributeName="fill" values="#14241C;#14241C;#0E9F6E;#14241C;#14241C" keyTimes="0;0.54;0.60;0.72;1" dur="10s" repeatCount="indefinite"/>
        </circle>
        <text x="855" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
        <text x="855" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#E8F3ED">Payment</text>
        <text x="855" y="217" text-anchor="middle" font-size="11" fill="#9DB3A9">gateways, receipts</text>
      </g>
      <g>
        <circle cx="1100" cy="140" r="19" fill="#14241C" stroke="#2A4738" stroke-width="2">
          <animate attributeName="fill" values="#14241C;#14241C;#0E9F6E;#14241C;#14241C" keyTimes="0;0.70;0.76;0.88;1" dur="10s" repeatCount="indefinite"/>
        </circle>
        <text x="1100" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
        <text x="1100" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#E8F3ED">Reports</text>
        <text x="1100" y="217" text-anchor="middle" font-size="11" fill="#9DB3A9">inventory, loyalty</text>
      </g>

      <text x="48" y="258" font-size="12" fill="#9DB3A9">Catalogue, orders, fulfilment, payments and reports all live in the same install.</text>
    </g>
  </g>
</svg>
