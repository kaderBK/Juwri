name: Container image

# On a version tag: build the Community self-host image from this repository's Dockerfile, push it to GHCR by digest,
# sign the digest with Sigstore (keyless, through this workflow's OIDC identity) and push SLSA build provenance next to
# it. The image is built from the public tree only, so it can never contain the Enterprise package.
#   build  contents: read + packages: write             runs the Dockerfile (third-party code); NO OIDC token
#   sign   packages: write + id-token + attestations    runs only pinned cosign / attest actions on the digest
# DRY RUN (the default for a manual run): the image is built but not pushed, and nothing is signed.
# No repository secret is used: GHCR login uses the workflow's own GITHUB_TOKEN.
# Verify: cosign verify ghcr.io/<owner>/<repo>@<digest> \
#   --certificate-identity-regexp '^https://github.com/<owner>/<repo>/\.github/workflows/container\.yml@refs/tags/v' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build only, push and sign nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

jobs:
  build:
    name: Build and push by digest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Image name (lower-case ghcr.io/<owner>/<repo>)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        if: env.DRY_RUN != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        id: push
        with:
          context: .
          push: ${{ env.DRY_RUN != 'true' }}
          provenance: false
          sbom: false
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}

  sign:
    name: Sign + SLSA provenance
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Digest is well-formed
        run: printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'

      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the digest (keyless Sigstore)
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/container\.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v1.4.3
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
