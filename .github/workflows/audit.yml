name: Dependency audit

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: composer audit and npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231 # 2.31.1
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: composer audit (locked dependencies)
        run: composer audit --locked --no-interaction --abandoned=report --working-dir=core

      - name: npm audit (production dependencies)
        run: |
          for dir in core desktop; do
            if [ ! -f "$dir/package-lock.json" ]; then
              echo "::error::$dir/package-lock.json is missing; npm audit cannot run" >&2
              exit 1
            fi
          done
          npm audit --omit=dev --audit-level=high --prefix core
          npm audit --omit=dev --audit-level=high --prefix desktop
