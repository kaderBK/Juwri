# XcodeGen spec — `xcodegen generate` recreates JuwriOwner.xcodeproj (also committed).
name: JuwriOwner
options:
  bundleIdPrefix: com.juwri
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  # Pinned exactly (AGENT-KICKOFF rule 9) — latest 1.x verified 2026-09-25.
  HotwireNative:
    url: https://github.com/hotwired/hotwire-native-ios
    exactVersion: 1.3.1
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  JuwriOwner:
    type: application
    platform: iOS
    sources:
      - path: JuwriOwner
        excludes:
          - "Resources/Info.plist"
          - "Resources/JuwriOwner.entitlements"
    dependencies:
      - package: HotwireNative
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        INFOPLIST_FILE: JuwriOwner/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: JuwriOwner/Resources/JuwriOwner.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""
    preBuildScripts: []
    postCompileScripts:
      - name: Copy Firebase config (outside the repo)
        basedOnDependencyAnalysis: false
        script: |
          # GoogleService-Info.plist is NEVER committed. Copy it into the app bundle when present.
          SRC="${HOME}/juwri-mobile-config/GoogleService-Info.plist"
          DST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ -f "$SRC" ]; then mkdir -p "$DST" && cp "$SRC" "$DST/GoogleService-Info.plist"; else echo "warning: GoogleService-Info.plist missing — push disabled"; fi
