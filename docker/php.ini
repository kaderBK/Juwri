; juwri in a container (FrankenPHP worker): production defaults, the same limits as the .htaccess of the shared-hosting build.
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
max_input_vars = 1000
post_max_size = 64M
upload_max_filesize = 64M
expose_php = Off
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; code does not change inside a production image: no stat() per request (set to 1 for the dev compose file)
opcache.validate_timestamps = ${OPCACHE_VALIDATE:-0}
realpath_cache_size = 4096K
realpath_cache_ttl = 600
