name: Publish to npm (with provenance)

# Publishing a verified n8n community node requires npm provenance since
# 2026-05-01 — the package must be published from CI via npm trusted publishing
# (OIDC). `id-token: write` is what lets npm mint the provenance attestation.
#
# Trigger: cut a GitHub Release (recommended) or run manually. The version in
# package.json must already be bumped and match the release tag.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # REQUIRED for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (n8n verification rules)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: n8n community security scan
        run: npx --yes @n8n/scan-community-package .

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          # With npm trusted publishing configured for this package on npmjs.com,
          # the OIDC id-token above is sufficient and this token can be omitted.
          # Kept for setups that still use a granular automation token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
