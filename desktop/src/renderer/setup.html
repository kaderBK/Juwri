<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
    <title>juwri Desktop</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
    <h1 data-i18n="setup.title">Connect to your store</h1>
    <p class="intro" data-i18n="setup.intro"></p>

    <div class="panel">
        <div class="field">
            <label for="serverUrl" data-i18n="setup.serverUrl">Server address</label>
            <input type="text" id="serverUrl" spellcheck="false" autocomplete="off">
            <p class="small muted" id="error" hidden></p>
        </div>
        <button class="btn primary" id="continue" data-i18n="setup.continue">Continue</button>
    </div>

    <p class="small muted">
        <span data-i18n="bridge.title">Print bridge</span>:
        <span class="mono" id="bridgeUrl"></span>
    </p>
</div>
<div class="toast" id="toast"></div>
<script src="setup.js"></script>
</body>
</html>
