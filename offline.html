<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a; color: #e2e8f0; padding: 24px; text-align: center;
        }
        .card { max-width: 360px; }
        .ic { font-size: 46px; line-height: 1; margin-bottom: 14px; }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        p { margin: 0 0 18px; opacity: .8; line-height: 1.5; }
        button {
            border: 0; border-radius: 10px; padding: 11px 20px; font: inherit; font-weight: 700;
            background: #38bdf8; color: #0f172a; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="ic" aria-hidden="true">&#128246;</div>
        <h1>You're offline</h1>
        <p>Reconnect to the internet to see this menu.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
